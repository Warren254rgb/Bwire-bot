name: Run Bwire Bot - XAUUSD Trailing

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MT5
        run: pip install MetaTrader5 Flask

      - name: Run Trailing Bot
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python trailing.py
